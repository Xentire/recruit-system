# 服务配置
server:
  port: 8080
  servlet:
    context-path: /

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruit_sys_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456
  ai:
    dashscope:
      api-key: ${WORKSPACE_ID}
      chat:
        options:
          model: qwen-plus
          temperature: 0


# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
#springdoc:
#  api-docs:
#    enabled: false
#  swagger-ui:
#    path: /swagger-ui.html

# 日志
logging:
  level:
    root: info
    com.wits.recsys: debug # 改成你自己的包名
    org.springframework.ai: DEBUG