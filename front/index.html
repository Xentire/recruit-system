<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招聘目标规划系统</title>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <!-- Axios -->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #333;
    }
    #app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .page-header {
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1d2129;
    }
    .page-header p {
      font-size: 13px;
      color: #86909c;
      margin-top: 4px;
    }

    /* ── 搜索栏 ── */
    .search-bar {
      background: #fff;
      padding: 20px 24px 0;
      border-radius: 6px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .search-bar .el-form-item { margin-bottom: 20px; }

    /* ── 工具栏 ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .toolbar:first-child { margin-top: 0; }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .toolbar-left .total-info { font-size: 14px; color: #4e5969; }

    /* ── 表格卡片 ── */
    .table-card {
      background: #fff;
      border-radius: 6px;
      padding: 20px 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .table-card .el-table { border-top: 1px solid #e5e6eb; }

    /* ── 行内编辑 ── */
    .inline-edit-wrap { display: flex; align-items: center; gap: 6px; }

    /* ── 分页 ── */
    .pagination-wrap {
      display: flex;
      justify-content: flex-end;
      padding-top: 20px;
    }

    /* ── 统一样式覆盖 ── */
    .el-table .el-table__header th {
      background: #f7f8fa;
      color: #1d2129;
      font-weight: 600;
    }
    .el-tag { font-weight: 400; }
    .el-button--primary { --el-button-bg-color: #165dff; }

    /* ── 空状态 ── */
    .empty-state { padding: 60px 0; text-align: center; color: #86909c; }

    /* ── AI 智能对话 ── */
    .chat-container {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #e5e6eb;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header h3 { font-size: 16px; font-weight: 600; color: #1d2129; }
    .chat-header span { font-size: 12px; color: #86909c; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      background: #f7f8fa;
    }
    .chat-messages .msg-empty {
      text-align: center;
      padding: 80px 0;
      color: #c9cdd4;
    }
    .chat-messages .msg-empty .msg-empty-text { margin-top: 8px; font-size: 14px; }

    .chat-msg {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }
    .chat-msg.user { align-items: flex-end; }
    .chat-msg.assistant { align-items: flex-start; }

    .chat-msg .bubble {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .chat-msg.user .bubble {
      background: #165dff;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .chat-msg.assistant .bubble {
      background: #fff;
      color: #1d2129;
      border: 1px solid #e5e6eb;
      border-bottom-left-radius: 2px;
    }
    .chat-msg .msg-time {
      font-size: 11px;
      color: #c9cdd4;
      margin-top: 4px;
    }
    .chat-msg.user .msg-time { text-align: right; }

    .chat-msg.loading .bubble {
      background: #fff;
      border: 1px solid #e5e6eb;
      color: #86909c;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }
    .chat-msg.loading .dot-pulse {
      display: inline-flex;
      gap: 4px;
    }
    .chat-msg.loading .dot-pulse span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #86909c;
      animation: pulse 1.2s infinite;
    }
    .chat-msg.loading .dot-pulse span:nth-child(2) { animation-delay: .2s; }
    .chat-msg.loading .dot-pulse span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

    /* ── 快捷指令 ── */
    .chat-quick-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px 0;
    }
    .chat-quick-actions .quick-label {
      font-size: 12px;
      color: #c9cdd4;
      flex-shrink: 0;
    }
    .chat-quick-actions .quick-tag {
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      padding: 4px 12px;
      transition: opacity .15s;
    }
    .chat-quick-actions .quick-tag:hover { opacity: .8; }

    .chat-input-area {
      padding: 12px 24px 16px;
      border-top: 1px solid #e5e6eb;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .chat-input-area .el-textarea { flex: 1; }
    .chat-input-area .send-btn { flex-shrink: 0; height: 44px; padding: 0 24px; }

    /* ── 标签页顶栏 ── */

    /* ── 标签页顶栏 ── */
    .el-tabs__header { background: #fff; padding: 0 20px; border-radius: 6px 6px 0 0; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .el-tabs__nav-wrap { margin-bottom: 0 !important; }
    .el-tabs__item { font-size: 15px; height: 52px; line-height: 52px; }
    .el-tabs__content { padding-top: 16px; }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      #app { padding: 12px; }
      .search-bar { padding: 16px 16px 0; }
      .table-card { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>招聘目标规划系统</h1>
      <p>AI-Agent 辅助招聘管理与目标规划平台</p>
    </div>

    <el-tabs type="border-card" @tab-click="handleTabClick">
      <!-- ==================== 岗位管理 ==================== -->
      <el-tab-pane label="岗位管理">
        <!-- 搜索栏 -->
        <div class="search-bar">
          <el-form :model="searchForm" label-width="80px" size="default">
            <el-row :gutter="20">
              <el-col :xs="24" :sm="8">
                <el-form-item label="岗位名称">
                  <el-input v-model="searchForm.positionName" placeholder="请输入岗位名称" clearable />
                </el-form-item>
              </el-col>
              <el-col :xs="24" :sm="8">
                <el-form-item label="所属团队">
                  <el-input v-model="searchForm.team" placeholder="请输入所属团队" clearable />
                </el-form-item>
              </el-col>
              <el-col :xs="24" :sm="8">
                <el-form-item label-width="0">
                  <el-button type="primary" @click="handleSearch">
                    <el-icon style="margin-right:4px"><Search /></el-icon>查询
                  </el-button>
                  <el-button @click="handleReset">重置</el-button>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
          <div class="toolbar-left">
            <span class="total-info">共 <strong>{{ total }}</strong> 条记录</span>
          </div>
          <el-button type="primary" @click="openAddDialog">
            <el-icon style="margin-right:4px"><Plus /></el-icon>新增岗位
          </el-button>
        </div>

        <!-- 表格 -->
        <div class="table-card">
          <el-table :data="positions" v-loading="loading" stripe border style="width:100%"
                    :empty-text="loading ? '加载中...' : '暂无数据'"
                    element-loading-text="加载中...">
            <el-table-column type="index" label="序号" width="60" align="center" />
            <el-table-column prop="positionName" label="岗位名称" min-width="140">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input v-model="editForm.positionName" size="small" placeholder="请输入" />
                </template>
                <template v-else>
                  {{ row.positionName }}
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="team" label="所属团队" min-width="120">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input v-model="editForm.team" size="small" placeholder="请输入" />
                </template>
                <template v-else>
                  {{ row.team }}
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="recruitCount" label="招聘人数" width="90" align="center">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input-number v-model="editForm.recruitCount" :min="1" :max="999" size="small" controls-position="right" style="width:80px" />
                </template>
                <template v-else>
                  {{ row.recruitCount }}
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="workCity" label="工作城市" width="110">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input v-model="editForm.workCity" size="small" placeholder="请输入" />
                </template>
                <template v-else>
                  {{ row.workCity }}
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="requiredSkills" label="技能要求" min-width="180">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input v-model="editForm.requiredSkills" size="small" placeholder="请输入" />
                </template>
                <template v-else>
                  <el-tooltip :content="row.requiredSkills" placement="top" :show-after="300">
                    <span class="text-ellipsis" style="display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom">
                      {{ row.requiredSkills }}
                    </span>
                  </el-tooltip>
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="status" label="状态" width="100" align="center">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-select v-model="editForm.status" size="small" style="width:90px">
                    <el-option v-for="opt in statusOptions" :key="opt.value" :label="opt.label" :value="opt.value" />
                  </el-select>
                </template>
                <template v-else>
                  <el-tag :type="getStatusInfo(row.status).type" size="small" effect="plain">
                    {{ getStatusInfo(row.status).label }}
                  </el-tag>
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="teamDailyCapacity" label="团队产能" width="90" align="center">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <el-input-number v-model="editForm.teamDailyCapacity" :min="1" :max="999" size="small" controls-position="right" style="width:80px" />
                </template>
                <template v-else>
                  {{ row.teamDailyCapacity }}
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="createTime" label="创建时间" width="165">
              <template #default="{ row }">
                {{ formatDate(row.createTime) }}
              </template>
            </el-table-column>
            <el-table-column label="操作" width="200" align="center" fixed="right">
              <template #default="{ row }">
                <template v-if="editingRowId === row.id">
                  <div class="inline-edit-wrap">
                    <el-button type="primary" link size="small" :loading="editLoading" @click="handleSave(row)">
                      <el-icon style="margin-right:3px"><Check /></el-icon>保存
                    </el-button>
                    <el-button type="info" link size="small" :disabled="editLoading" @click="handleCancel()">
                      <el-icon style="margin-right:3px"><Close /></el-icon>取消
                    </el-button>
                  </div>
                </template>
                <template v-else>
                  <el-button type="primary" link size="small" @click="handleEdit(row)">
                    <el-icon style="margin-right:3px"><Edit /></el-icon>编辑
                  </el-button>
                  <el-button type="danger" link size="small" @click="handlePositionDelete(row)">
                    <el-icon style="margin-right:3px"><Delete /></el-icon>删除
                  </el-button>
                </template>
              </template>
            </el-table-column>
          </el-table>

          <!-- 分页 -->
          <div class="pagination-wrap" v-if="total > 0">
            <el-pagination
              v-model:current-page="currentPage"
              v-model:page-size="pageSize"
              :page-sizes="[10, 20, 50, 100]"
              :total="total"
              layout="total, sizes, prev, pager, next, jumper"
              @current-change="handlePageChange"
              @size-change="handleSizeChange"
            />
          </div>
        </div>

        <!-- 新增岗位 Dialog -->
        <el-dialog v-model="addDialogVisible" title="新增岗位" width="600px" :close-on-click-modal="false" :before-close="() => { addDialogVisible = false; resetAddForm(); }">
          <el-form ref="addFormRef" :model="addForm" :rules="addRules" label-width="110px" label-position="right" status-icon>
            <el-row :gutter="20">
              <el-col :span="24">
                <el-form-item label="岗位名称" prop="positionName">
                  <el-input v-model="addForm.positionName" placeholder="请输入岗位名称" maxlength="100" show-word-limit />
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="所属团队" prop="team">
                  <el-input v-model="addForm.team" placeholder="请输入所属团队" maxlength="50" />
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="工作城市" prop="workCity">
                  <el-input v-model="addForm.workCity" placeholder="请输入工作城市" maxlength="50" />
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="招聘人数" prop="recruitCount">
                  <el-input-number v-model="addForm.recruitCount" :min="1" :max="999" controls-position="right" style="width:100%" />
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="团队产能" prop="teamDailyCapacity">
                  <el-input-number v-model="addForm.teamDailyCapacity" :min="1" :max="999" controls-position="right" style="width:100%" />
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="状态" prop="status">
                  <el-select v-model="addForm.status" style="width:100%">
                    <el-option v-for="opt in statusOptions" :key="opt.value" :label="opt.label" :value="opt.value" />
                  </el-select>
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="24">
                <el-form-item label="技能要求" prop="requiredSkills">
                  <el-input v-model="addForm.requiredSkills" type="textarea" :rows="3" placeholder="请输入技能要求，多个技能用逗号分隔" maxlength="500" show-word-limit />
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
          <template #footer>
            <el-button @click="addDialogVisible = false; resetAddForm();">取消</el-button>
            <el-button type="primary" :loading="addLoading" @click="handleAdd">确认新增</el-button>
          </template>
        </el-dialog>
      </el-tab-pane>

      <!-- ==================== 候选人管理 ==================== -->
      <el-tab-pane label="候选人管理">
        <!-- 工具栏 -->
        <div class="toolbar" style="margin-top:0">
          <div class="toolbar-left">
            <span class="total-info">共 <strong>{{ candidateTotal }}</strong> 条记录</span>
          </div>
          <el-button type="primary" @click="openCandidateAddDialog">
            <el-icon style="margin-right:4px"><Plus /></el-icon>新增候选人
          </el-button>
        </div>

        <!-- 表格 -->
        <div class="table-card">
          <el-table :data="candidates" v-loading="candidateLoading" stripe border style="width:100%"
                    :empty-text="candidateLoading ? '加载中...' : '暂无数据'"
                    element-loading-text="加载中...">
            <el-table-column type="index" label="序号" width="60" align="center" />
            <el-table-column prop="name" label="姓名" min-width="110">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <el-input v-model="candidateEditForm.name" size="small" placeholder="请输入姓名" />
                </template>
                <template v-else>{{ row.name }}</template>
              </template>
            </el-table-column>
            <el-table-column prop="phone" label="手机号" width="140">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <el-input v-model="candidateEditForm.phone" size="small" placeholder="请输入手机号" maxlength="11" />
                </template>
                <template v-else>{{ row.phone }}</template>
              </template>
            </el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="180">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <el-input v-model="candidateEditForm.email" size="small" placeholder="请输入邮箱" />
                </template>
                <template v-else>{{ row.email }}</template>
              </template>
            </el-table-column>
            <el-table-column prop="education" label="学历" width="90" align="center">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <el-select v-model="candidateEditForm.education" size="small" style="width:80px">
                    <el-option v-for="opt in educationOptions" :key="opt" :label="opt" :value="opt" />
                  </el-select>
                </template>
                <template v-else>
                  <el-tag size="small" effect="plain" type="info">{{ row.education }}</el-tag>
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="workExperience" label="工作经验" min-width="200">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <el-input v-model="candidateEditForm.workExperience" type="textarea" :rows="1" size="small" placeholder="工作经验" />
                </template>
                <template v-else>
                  <el-tooltip :content="row.workExperience || ''" placement="top" :show-after="300" :disabled="!row.workExperience">
                    <span style="display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom">
                      {{ row.workExperience || '-' }}
                    </span>
                  </el-tooltip>
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="createTime" label="创建时间" width="165">
              <template #default="{ row }">{{ formatDate(row.createTime) }}</template>
            </el-table-column>
            <el-table-column prop="updateTime" label="更新时间" width="165">
              <template #default="{ row }">{{ formatDate(row.updateTime) }}</template>
            </el-table-column>
            <el-table-column label="操作" width="200" align="center" fixed="right">
              <template #default="{ row }">
                <template v-if="candidateEditingRowId === row.id">
                  <div class="inline-edit-wrap">
                    <el-button type="primary" link size="small" :loading="candidateEditLoading" @click="handleCandidateSave(row)">
                      <el-icon style="margin-right:3px"><Check /></el-icon>保存
                    </el-button>
                    <el-button type="info" link size="small" :disabled="candidateEditLoading" @click="handleCandidateCancel()">
                      <el-icon style="margin-right:3px"><Close /></el-icon>取消
                    </el-button>
                  </div>
                </template>
                <template v-else>
                  <el-button type="primary" link size="small" @click="handleCandidateEdit(row)">
                    <el-icon style="margin-right:3px"><Edit /></el-icon>编辑
                  </el-button>
                  <el-button type="danger" link size="small" @click="handleCandidateDelete(row)">
                    <el-icon style="margin-right:3px"><Delete /></el-icon>删除
                  </el-button>
                </template>
              </template>
            </el-table-column>
          </el-table>

          <!-- 分页 -->
          <div class="pagination-wrap" v-if="candidateTotal > 0">
            <el-pagination
              v-model:current-page="candidatePage"
              v-model:page-size="candidatePageSize"
              :page-sizes="[10, 20, 50, 100]"
              :total="candidateTotal"
              layout="total, sizes, prev, pager, next, jumper"
              @current-change="handleCandidatePageChange"
              @size-change="handleCandidateSizeChange"
            />
          </div>
        </div>

        <!-- 新增候选人 Dialog -->
        <el-dialog v-model="candidateAddDialogVisible" title="新增候选人" width="600px" :close-on-click-modal="false" :before-close="() => { candidateAddDialogVisible = false; resetCandidateAddForm(); }">
          <el-form ref="candidateAddFormRef" :model="candidateAddForm" :rules="candidateAddRules" label-width="110px" label-position="right" status-icon>
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="姓名" prop="name">
                  <el-input v-model="candidateAddForm.name" placeholder="请输入姓名" maxlength="50" />
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="学历" prop="education">
                  <el-select v-model="candidateAddForm.education" placeholder="请选择学历" style="width:100%">
                    <el-option v-for="opt in educationOptions" :key="opt" :label="opt" :value="opt" />
                  </el-select>
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="手机号" prop="phone">
                  <el-input v-model="candidateAddForm.phone" placeholder="请输入手机号" maxlength="11" />
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="邮箱" prop="email">
                  <el-input v-model="candidateAddForm.email" placeholder="请输入邮箱" maxlength="100" />
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="24">
                <el-form-item label="工作经验" prop="workExperience">
                  <el-input v-model="candidateAddForm.workExperience" type="textarea" :rows="3" placeholder="请描述工作经验（选填）" maxlength="500" show-word-limit />
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
          <template #footer>
            <el-button @click="candidateAddDialogVisible = false; resetCandidateAddForm();">取消</el-button>
            <el-button type="primary" :loading="candidateAddLoading" @click="handleCandidateAdd">确认新增</el-button>
          </template>
        </el-dialog>
      </el-tab-pane>

      <!-- ==================== 候选人推荐 ==================== -->
      <el-tab-pane label="候选人推荐">
        <!-- 工具栏 -->
        <div class="toolbar" style="margin-top:0">
          <div class="toolbar-left">
            <span class="total-info">共 <strong>{{ recommendTotal }}</strong> 条记录</span>
          </div>
          <el-button type="primary" @click="openRecommendAddDialog">
            <el-icon style="margin-right:4px"><Plus /></el-icon>新增推荐
          </el-button>
        </div>

        <!-- 表格 -->
        <div class="table-card">
          <el-table :data="recommends" v-loading="recommendLoading" stripe border style="width:100%"
                    :empty-text="recommendLoading ? '加载中...' : '暂无数据'"
                    element-loading-text="加载中...">
            <el-table-column type="index" label="序号" width="60" align="center" />
            <el-table-column label="岗位名称" min-width="150">
              <template #default="{ row }">{{ row.positionName }}</template>
            </el-table-column>
            <el-table-column label="候选人" min-width="120">
              <template #default="{ row }">{{ row.candidateName }}</template>
            </el-table-column>
            <el-table-column prop="recommendStatus" label="推荐状态" width="110" align="center">
              <template #default="{ row }">
                <template v-if="recommendEditingRowId === row.id">
                  <el-select v-model="recommendEditForm.recommendStatus" size="small" style="width:100px">
                    <el-option v-for="opt in recommendStatusOptions" :key="opt.value" :label="opt.label" :value="opt.value" />
                  </el-select>
                </template>
                <template v-else>
                  <el-tag :type="getRecommendTagInfo(row.recommendStatus).type" size="small" effect="plain">
                    {{ row.recommendStatusDesc || getRecommendTagInfo(row.recommendStatus).label }}
                  </el-tag>
                </template>
              </template>
            </el-table-column>
            <el-table-column prop="recommendTime" label="推荐时间" width="165">
              <template #default="{ row }">{{ formatDate(row.recommendTime) }}</template>
            </el-table-column>
            <el-table-column prop="interviewTime" label="面试时间" width="165">
              <template #default="{ row }">
                <span v-if="row.interviewTime">{{ formatDate(row.interviewTime) }}</span>
                <span v-else style="color:#c9cdd4">-</span>
              </template>
            </el-table-column>
            <el-table-column prop="createTime" label="创建时间" width="165">
              <template #default="{ row }">{{ formatDate(row.createTime) }}</template>
            </el-table-column>
            <el-table-column label="操作" width="160" align="center" fixed="right">
              <template #default="{ row }">
                <template v-if="recommendEditingRowId === row.id">
                  <div class="inline-edit-wrap">
                    <el-button type="primary" link size="small" :loading="recommendEditLoading" @click="handleRecommendSave(row)">
                      <el-icon style="margin-right:3px"><Check /></el-icon>保存
                    </el-button>
                    <el-button type="info" link size="small" :disabled="recommendEditLoading" @click="handleRecommendCancel()">
                      <el-icon style="margin-right:3px"><Close /></el-icon>取消
                    </el-button>
                  </div>
                </template>
                <template v-else>
                  <el-button type="primary" link size="small" @click="handleRecommendEdit(row)">
                    <el-icon style="margin-right:3px"><Edit /></el-icon>编辑
                  </el-button>
                </template>
              </template>
            </el-table-column>
          </el-table>

          <!-- 分页 -->
          <div class="pagination-wrap" v-if="recommendTotal > 0">
            <el-pagination
              v-model:current-page="recommendPage"
              v-model:page-size="recommendPageSize"
              :page-sizes="[10, 20, 50, 100]"
              :total="recommendTotal"
              layout="total, sizes, prev, pager, next, jumper"
              @current-change="handleRecommendPageChange"
              @size-change="handleRecommendSizeChange"
            />
          </div>
        </div>

        <!-- 新增推荐 Dialog -->
        <el-dialog v-model="recommendAddDialogVisible" title="新增推荐" width="520px" :close-on-click-modal="false" :before-close="() => { recommendAddDialogVisible = false; resetRecommendAddForm(); }">
          <el-form ref="recommendAddFormRef" :model="recommendAddForm" :rules="recommendAddRules" label-width="110px" label-position="right" status-icon>
            <el-row :gutter="20">
              <el-col :span="24">
                <el-form-item label="推荐岗位" prop="positionId">
                  <el-select v-model="recommendAddForm.positionId" placeholder="请选择岗位" style="width:100%" filterable :loading="positionOptionsLoading">
                    <el-option v-for="opt in positionOptions" :key="opt.id" :label="opt.positionName" :value="opt.id" />
                  </el-select>
                </el-form-item>
              </el-col>
            </el-row>
            <el-row :gutter="20">
              <el-col :span="24">
                <el-form-item label="候选人" prop="candidateId">
                  <el-select v-model="recommendAddForm.candidateId" placeholder="请选择候选人" style="width:100%" filterable :loading="candidateOptionsLoading">
                    <el-option v-for="opt in candidateOptions" :key="opt.id" :label="opt.name" :value="opt.id" />
                  </el-select>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
          <template #footer>
            <el-button @click="recommendAddDialogVisible = false; resetRecommendAddForm();">取消</el-button>
            <el-button type="primary" :loading="recommendAddLoading" @click="handleRecommendAdd">确认新增</el-button>
          </template>
        </el-dialog>
      </el-tab-pane>

      <!-- ==================== AI 智能对话 ==================== -->
      <el-tab-pane label="AI智能对话">
        <div class="chat-container">
          <div class="chat-header">
            <el-icon :size="20" color="#165dff"><ChatDotRound /></el-icon>
            <h3>AI 招聘助手</h3>
            <span>· 智能对话</span>
          </div>

          <!-- 消息列表 -->
          <div class="chat-messages" ref="chatMessagesRef">
            <div v-if="messages.length === 0" class="msg-empty">
              <el-icon :size="48" color="#e5e6eb"><ChatLineSquare /></el-icon>
              <p class="msg-empty-text">您好！我是 AI 招聘助手，请提出您的问题</p>
            </div>

            <div v-for="(msg, idx) in messages" :key="idx" :class="['chat-msg', msg.role]">
              <div class="bubble">{{ msg.content }}</div>
              <div class="msg-time">{{ msg.time }}</div>
            </div>

            <!-- 加载中 -->
            <div v-if="chatLoading" class="chat-msg assistant loading">
              <div class="bubble">
                <span>思考中</span>
                <span class="dot-pulse">
                  <span></span><span></span><span></span>
                </span>
              </div>
            </div>
          </div>

          <!-- 快捷指令 -->
          <div class="chat-quick-actions" v-if="!chatLoading">
            <span class="quick-label">快捷指令：</span>
            <el-tag
              class="quick-tag"
              effect="plain"
              color="#e8f3ff"
              @click="fillQuickPrompt('生成招聘目标周表')"
            >
              <el-icon style="margin-right:3px" color="#165dff"><Lightning /></el-icon>生成招聘目标周表
            </el-tag>
          </div>

          <!-- 输入区 -->
          <div class="chat-input-area">
            <el-input
              v-model="chatInput"
              type="textarea"
              :rows="2"
              placeholder="请输入您的问题，例如：请帮我分析当前招聘进度..."
              :disabled="chatLoading"
              @keydown.enter.prevent="handleSend"
            />
            <el-button class="send-btn" type="primary" :loading="chatLoading" @click="handleSend" :disabled="!chatInput.trim()">
              发送
            </el-button>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <script>
    'use strict';

    const { createApp, ref, reactive, onMounted, nextTick } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      setup() {
        // ──────────────────── 常量 ────────────────────
        const statusEnumMap = {
          RECRUITING:  { value: 1, label: '招聘中', type: 'success' },
          PAUSED:      { value: 2, label: '暂停招聘', type: 'warning' },
          SUSPENDED:   { value: 2, label: '暂停招聘', type: 'warning' },
          STOPPED:     { value: 3, label: '停止招聘', type: 'info' }
        };
        const statusOptions = [
          { value: 1, label: '招聘中' },
          { value: 2, label: '暂停招聘' },
          { value: 3, label: '停止招聘' }
        ];
        const educationOptions = ['高中', '大专', '本科', '硕士', '博士'];

        const recommendStatusOptions = [
          { value: 1, label: '已推荐' },
          { value: 2, label: '待面试' },
          { value: 3, label: '面试通过' },
          { value: 4, label: '已入职' },
          { value: 5, label: '面试淘汰' }
        ];

        // ──────────────────── 岗位管理 状态 ────────────────────
        const positions     = ref([]);
        const total         = ref(0);
        const currentPage   = ref(1);
        const pageSize      = ref(10);
        const loading       = ref(false);
        const searchForm    = reactive({ positionName: '', team: '' });

        const addDialogVisible = ref(false);
        const addFormRef   = ref(null);
        const addLoading   = ref(false);
        const addForm      = reactive({
          positionName: '', team: '', recruitCount: 1, workCity: '',
          requiredSkills: '', status: 1, teamDailyCapacity: 1
        });

        const editingRowId = ref(null);
        const editLoading  = ref(false);
        const editForm     = reactive({
          positionName: '', team: '', recruitCount: 1, workCity: '',
          requiredSkills: '', status: 1, teamDailyCapacity: 1
        });

        // ──────────────────── 候选人管理 状态 ────────────────────
        const candidates         = ref([]);
        const candidateTotal     = ref(0);
        const candidatePage      = ref(1);
        const candidatePageSize  = ref(10);
        const candidateLoading   = ref(false);

        const candidateAddDialogVisible = ref(false);
        const candidateAddFormRef = ref(null);
        const candidateAddLoading = ref(false);
        const candidateAddForm = reactive({
          name: '', phone: '', email: '', education: '本科', workExperience: ''
        });

        const candidateEditingRowId = ref(null);
        const candidateEditLoading = ref(false);
        const candidateEditForm = reactive({
          name: '', phone: '', email: '', education: '', workExperience: ''
        });

        // ──────────────────── 候选人推荐 状态 ────────────────────
        const recommends             = ref([]);
        const recommendTotal         = ref(0);
        const recommendPage          = ref(1);
        const recommendPageSize      = ref(10);
        const recommendLoading       = ref(false);

        // 岗位/候选人选项（新增推荐下拉使用）
        const positionOptions        = ref([]);
        const positionOptionsLoading = ref(false);
        const candidateOptions       = ref([]);
        const candidateOptionsLoading = ref(false);
        let recommendDropdownFetched = false;

        const recommendAddDialogVisible = ref(false);
        const recommendAddFormRef = ref(null);
        const recommendAddLoading = ref(false);
        const recommendAddForm = reactive({
          positionId: '', candidateId: ''
        });

        const recommendEditingRowId = ref(null);
        const recommendEditLoading = ref(false);
        const recommendEditForm = reactive({
          recommendStatus: 1
        });

        // ──────────────────── 工具函数 ────────────────────
        function getStatusInfo(status) {
          if (typeof status === 'string') {
            return statusEnumMap[status] || { value: 0, label: status, type: '' };
          }
          for (const key in statusEnumMap) {
            if (statusEnumMap[key].value === Number(status)) {
              return statusEnumMap[key];
            }
          }
          return { value: status, label: String(status), type: '' };
        }

        function getStatusValue(status) {
          if (typeof status === 'number') return status;
          if (typeof status === 'string' && statusEnumMap[status]) {
            return statusEnumMap[status].value;
          }
          return 1;
        }

        function formatDate(dateStr) {
          if (!dateStr) return '';
          try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          } catch { return dateStr; }
        }

        // ──────────────────── 岗位管理 表单校验 ────────────────────
        const addRules = {
          positionName: [
            { required: true, message: '请输入岗位名称', trigger: 'blur' },
            { min: 1, max: 100, message: '长度在 1 到 100 个字符', trigger: 'blur' }
          ],
          team: [ { required: true, message: '请输入所属团队', trigger: 'blur' } ],
          recruitCount: [
            { required: true, message: '请输入招聘人数', trigger: 'blur' },
            { type: 'number', min: 1, message: '必须为正整数', trigger: 'blur' }
          ],
          workCity: [ { required: true, message: '请输入工作城市', trigger: 'blur' } ],
          requiredSkills: [ { required: true, message: '请输入技能要求', trigger: 'blur' } ],
          teamDailyCapacity: [
            { required: true, message: '请输入团队团队产能', trigger: 'blur' },
            { type: 'number', min: 1, message: '必须为正整数', trigger: 'blur' }
          ]
        };

        // ──────────────────── 候选人管理 表单校验 ────────────────────
        const phoneRegex  = /^1[3-9]\d{9}$/;
        const emailRegex  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const candidateAddRules = {
          name: [ { required: true, message: '请输入姓名', trigger: 'blur' } ],
          phone: [
            { required: true, message: '请输入手机号', trigger: 'blur' },
            { pattern: phoneRegex, message: '手机号格式不正确（11位手机号）', trigger: 'blur' }
          ],
          email: [
            { required: true, message: '请输入邮箱', trigger: 'blur' },
            { pattern: emailRegex, message: '邮箱格式不正确', trigger: 'blur' }
          ],
          education: [ { required: true, message: '请选择学历', trigger: 'change' } ]
        };

        const recommendAddRules = {
          positionId: [
            { required: true, message: '请选择推荐岗位', trigger: 'change' }
          ],
          candidateId: [
            { required: true, message: '请选择候选人', trigger: 'change' }
          ]
        };

        // ──────────────────── API ────────────────────
        const api = axios.create({ baseURL: 'http://localhost:8080', timeout: 30000 });

        api.interceptors.response.use(
          res => res,
          error => {
            if (error.code === 'ERR_NETWORK') {
              ElMessage.error('无法连接到后端服务，请确认服务已启动');
            } else if (error.response) {
              ElMessage.error(`请求失败 (${error.response.status}): ${error.response.statusText}`);
            } else {
              ElMessage.error('网络异常: ' + (error.message || '未知错误'));
            }
            return Promise.reject(error);
          }
        );

        // ============================================================
        //  岗位管理 API
        // ============================================================

        async function fetchList() {
          loading.value = true;
          try {
            const params = { pageNum: currentPage.value, pageSize: pageSize.value };
            if (searchForm.positionName.trim()) params.positionName = searchForm.positionName.trim();
            if (searchForm.team.trim()) params.team = searchForm.team.trim();
            const res = await api.get('/position/list', { params });
            if (res.data && res.data.code === 200) {
              const pageData = res.data.data || {};
              positions.value = pageData.records || [];
              total.value = pageData.total || 0;
            } else {
              ElMessage.error(res.data?.msg || '获取岗位列表失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            loading.value = false;
          }
        }

        function resetAddForm() {
          addForm.positionName = '';
          addForm.team = '';
          addForm.recruitCount = 1;
          addForm.workCity = '';
          addForm.requiredSkills = '';
          addForm.status = 1;
          addForm.teamDailyCapacity = 1;
          addFormRef.value?.clearValidate();
        }

        function openAddDialog() {
          resetAddForm();
          addDialogVisible.value = true;
        }

        async function handleAdd() {
          if (!addFormRef.value) return;
          try { await addFormRef.value.validate(); } catch { return; }
          addLoading.value = true;
          try {
            const payload = {
              positionName: addForm.positionName.trim(),
              team: addForm.team.trim(),
              recruitCount: addForm.recruitCount,
              workCity: addForm.workCity.trim(),
              requiredSkills: addForm.requiredSkills.trim(),
              status: addForm.status,
              teamDailyCapacity: addForm.teamDailyCapacity
            };
            const res = await api.post('/position/add', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('新增岗位成功');
              addDialogVisible.value = false;
              resetAddForm();
              await fetchList();
            } else {
              ElMessage.error(res.data?.msg || '新增失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            addLoading.value = false;
          }
        }

        function handleEdit(row) {
          editingRowId.value = row.id;
          editForm.positionName    = row.positionName || '';
          editForm.team            = row.team || '';
          editForm.recruitCount    = row.recruitCount ?? 1;
          editForm.workCity        = row.workCity || '';
          editForm.requiredSkills  = row.requiredSkills || '';
          editForm.status          = getStatusValue(row.status);
          editForm.teamDailyCapacity = row.teamDailyCapacity ?? 1;
        }

        function validateEditForm() {
          if (!editForm.positionName.trim())   return '岗位名称不能为空';
          if (!editForm.team.trim())           return '所属团队不能为空';
          if (!editForm.workCity.trim())       return '工作城市不能为空';
          if (!editForm.requiredSkills.trim()) return '技能要求不能为空';
          if (!editForm.recruitCount || editForm.recruitCount < 1) return '招聘人数必须为正整数';
          if (!editForm.teamDailyCapacity || editForm.teamDailyCapacity < 1) return '团队产能必须为正整数';
          return '';
        }

        async function handleSave(row) {
          const err = validateEditForm();
          if (err) { ElMessage.warning(err); return; }
          editLoading.value = true;
          try {
            const payload = {
              id: row.id,
              positionName: editForm.positionName.trim(),
              team: editForm.team.trim(),
              recruitCount: editForm.recruitCount,
              workCity: editForm.workCity.trim(),
              requiredSkills: editForm.requiredSkills.trim(),
              status: editForm.status,
              teamDailyCapacity: editForm.teamDailyCapacity
            };
            const res = await api.put('/position/update', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('修改成功');
              editingRowId.value = null;
              await fetchList();
            } else {
              ElMessage.error(res.data?.msg || '修改失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            editLoading.value = false;
          }
        }

        function handleCancel() { editingRowId.value = null; }

        async function handlePositionDelete(row) {
          try {
            await ElMessageBox.confirm(
              `确定要删除岗位「${row.positionName}」吗？此操作不可恢复。`,
              '确认删除',
              { confirmButtonText: '确定删除', cancelButtonText: '取消', type: 'warning', draggable: true }
            );
            const res = await api.delete('/position/delete', { params: { id: row.id } });
            if (res.data && res.data.code === 200) {
              ElMessage.success('删除成功');
              await fetchList();
            } else {
              ElMessage.error(res.data?.msg || '删除失败');
            }
          } catch (err) {
            if (err !== 'cancel') console.error(err);
          }
        }

        function handleSearch() { currentPage.value = 1; fetchList(); }
        function handleReset() { searchForm.positionName = ''; searchForm.team = ''; currentPage.value = 1; fetchList(); }
        function handlePageChange(page) { currentPage.value = page; fetchList(); }
        function handleSizeChange(size) { pageSize.value = size; currentPage.value = 1; fetchList(); }

        // ============================================================
        //  候选人管理 API
        // ============================================================

        async function fetchCandidateList() {
          candidateLoading.value = true;
          try {
            const params = { pageNum: candidatePage.value, pageSize: candidatePageSize.value };
            const res = await api.get('/candidate/list', { params });
            if (res.data && res.data.code === 200) {
              const pageData = res.data.data || {};
              candidates.value = pageData.records || [];
              candidateTotal.value = pageData.total || 0;
            } else {
              ElMessage.error(res.data?.msg || '获取候选人列表失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            candidateLoading.value = false;
          }
        }

        function resetCandidateAddForm() {
          candidateAddForm.name = '';
          candidateAddForm.phone = '';
          candidateAddForm.email = '';
          candidateAddForm.education = '本科';
          candidateAddForm.workExperience = '';
          candidateAddFormRef.value?.clearValidate();
        }

        function openCandidateAddDialog() {
          resetCandidateAddForm();
          candidateAddDialogVisible.value = true;
        }

        async function handleCandidateAdd() {
          if (!candidateAddFormRef.value) return;
          try { await candidateAddFormRef.value.validate(); } catch { return; }
          candidateAddLoading.value = true;
          try {
            const payload = {
              name: candidateAddForm.name.trim(),
              phone: candidateAddForm.phone.trim(),
              email: candidateAddForm.email.trim(),
              education: candidateAddForm.education,
              workExperience: candidateAddForm.workExperience.trim() || undefined
            };
            const res = await api.post('/candidate/add', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('新增候选人成功');
              candidateAddDialogVisible.value = false;
              resetCandidateAddForm();
              await fetchCandidateList();
            } else {
              ElMessage.error(res.data?.msg || '新增失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            candidateAddLoading.value = false;
          }
        }

        function handleCandidateEdit(row) {
          candidateEditingRowId.value = row.id;
          candidateEditForm.name           = row.name || '';
          candidateEditForm.phone          = row.phone || '';
          candidateEditForm.email          = row.email || '';
          candidateEditForm.education      = row.education || '本科';
          candidateEditForm.workExperience = row.workExperience || '';
        }

        function validateCandidateEditForm() {
          if (!candidateEditForm.name.trim())           return '姓名不能为空';
          if (!candidateEditForm.phone.trim())          return '手机号不能为空';
          if (!phoneRegex.test(candidateEditForm.phone.trim())) return '手机号格式不正确';
          if (!candidateEditForm.email.trim())          return '邮箱不能为空';
          if (!emailRegex.test(candidateEditForm.email.trim())) return '邮箱格式不正确';
          if (!candidateEditForm.education)             return '请选择学历';
          return '';
        }

        async function handleCandidateSave(row) {
          const err = validateCandidateEditForm();
          if (err) { ElMessage.warning(err); return; }
          candidateEditLoading.value = true;
          try {
            const payload = {
              id: row.id,
              name: candidateEditForm.name.trim(),
              phone: candidateEditForm.phone.trim(),
              email: candidateEditForm.email.trim(),
              education: candidateEditForm.education,
              workExperience: candidateEditForm.workExperience.trim() || undefined
            };
            const res = await api.put('/candidate/update', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('修改成功');
              candidateEditingRowId.value = null;
              await fetchCandidateList();
            } else {
              ElMessage.error(res.data?.msg || '修改失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            candidateEditLoading.value = false;
          }
        }

        function handleCandidateCancel() { candidateEditingRowId.value = null; }

        async function handleCandidateDelete(row) {
          try {
            await ElMessageBox.confirm(
              `确定要删除候选人「${row.name}」吗？此操作不可恢复。`,
              '确认删除',
              { confirmButtonText: '确定删除', cancelButtonText: '取消', type: 'warning', draggable: true }
            );
            const res = await api.delete('/candidate/delete', { params: { id: row.id } });
            if (res.data && res.data.code === 200) {
              ElMessage.success('删除成功');
              await fetchCandidateList();
            } else {
              ElMessage.error(res.data?.msg || '删除失败');
            }
          } catch (err) {
            if (err !== 'cancel') console.error(err);
          }
        }

        function handleCandidatePageChange(page) { candidatePage.value = page; fetchCandidateList(); }
        function handleCandidateSizeChange(size) { candidatePageSize.value = size; candidatePage.value = 1; fetchCandidateList(); }

        // ============================================================
        //  候选人推荐 API
        // ============================================================

        function getRecommendTagInfo(status) {
          const map = {
            1: { label: '已推荐', type: 'primary' },
            2: { label: '待面试', type: 'warning' },
            3: { label: '面试通过', type: 'success' },
            4: { label: '已入职', type: 'danger' },
            5: { label: '面试淘汰', type: 'info' }
          };
          return map[status] || { label: '未知', type: 'info' };
        }

        async function fetchRecommendOptions() {
          positionOptionsLoading.value = true;
          candidateOptionsLoading.value = true;
          try {
            const [posRes, candRes] = await Promise.all([
              api.get('/position/list', { params: { pageNum: 1, pageSize: 999 } }),
              api.get('/candidate/list', { params: { pageNum: 1, pageSize: 999 } })
            ]);
            if (posRes.data?.code === 200) {
              positionOptions.value = posRes.data.data?.records || [];
            }
            if (candRes.data?.code === 200) {
              candidateOptions.value = candRes.data.data?.records || [];
            }
          } catch { /* 拦截器已处理 */ } finally {
            positionOptionsLoading.value = false;
            candidateOptionsLoading.value = false;
          }
        }

        async function fetchRecommendList() {
          recommendLoading.value = true;
          try {
            const params = { pageNum: recommendPage.value, pageSize: recommendPageSize.value };
            const res = await api.get('/recommend/list', { params });
            if (res.data && res.data.code === 200) {
              const pageData = res.data.data || {};
              recommends.value = pageData.records || [];
              recommendTotal.value = pageData.total || 0;
            } else {
              ElMessage.error(res.data?.msg || '获取推荐列表失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            recommendLoading.value = false;
          }
        }

        function resetRecommendAddForm() {
          recommendAddForm.positionId = '';
          recommendAddForm.candidateId = '';
          recommendAddFormRef.value?.clearValidate();
        }

        function openRecommendAddDialog() {
          resetRecommendAddForm();
          if (!recommendDropdownFetched) {
            recommendDropdownFetched = true;
            fetchRecommendOptions();
          }
          recommendAddDialogVisible.value = true;
        }

        async function handleRecommendAdd() {
          if (!recommendAddFormRef.value) return;
          try { await recommendAddFormRef.value.validate(); } catch { return; }
          recommendAddLoading.value = true;
          try {
            const payload = {
              positionId: recommendAddForm.positionId,
              candidateId: recommendAddForm.candidateId
            };
            const res = await api.post('/recommend/add', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('新增推荐成功');
              recommendAddDialogVisible.value = false;
              resetRecommendAddForm();
              await fetchRecommendList();
            } else {
              ElMessage.error(res.data?.msg || '新增推荐失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            recommendAddLoading.value = false;
          }
        }

        function handleRecommendEdit(row) {
          recommendEditingRowId.value = row.id;
          recommendEditForm.recommendStatus = row.recommendStatus;
        }

        async function handleRecommendSave(row) {
          if (!recommendEditForm.recommendStatus) {
            ElMessage.warning('请选择推荐状态');
            return;
          }
          recommendEditLoading.value = true;
          try {
            const payload = { id: row.id, recommendStatus: recommendEditForm.recommendStatus };
            const res = await api.put('/recommend/update', payload);
            if (res.data && res.data.code === 200) {
              ElMessage.success('状态修改成功');
              recommendEditingRowId.value = null;
              await fetchRecommendList();
            } else {
              ElMessage.error(res.data?.msg || '状态修改失败');
            }
          } catch { /* 拦截器已处理 */ } finally {
            recommendEditLoading.value = false;
          }
        }

        function handleRecommendCancel() { recommendEditingRowId.value = null; }

        function handleRecommendPageChange(page) { recommendPage.value = page; fetchRecommendList(); }
        function handleRecommendSizeChange(size) { recommendPageSize.value = size; recommendPage.value = 1; fetchRecommendList(); }

        // ============================================================
        //  AI 智能对话
        // ============================================================

        const messages     = ref([]);
        const chatInput    = ref('');
        const chatLoading  = ref(false);
        const chatMessagesRef = ref(null);

        function scrollToBottom() {
          nextTick(() => {
            const el = chatMessagesRef.value;
            if (el && el.$el) {
              el.$el.scrollTop = el.$el.scrollHeight;
            } else if (el) {
              el.scrollTop = el.scrollHeight;
            }
          });
        }

        function addMessage(role, content) {
          const now = new Date();
          const pad = n => String(n).padStart(2, '0');
          const time = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
          messages.value.push({ role, content, time });
        }

        function fillQuickPrompt(text) {
          chatInput.value = text;
          // 聚焦到输入框
          nextTick(() => {
            const textarea = document.querySelector('.chat-input-area textarea');
            textarea?.focus();
          });
        }

        async function handleSend() {
          const question = chatInput.value.trim();
          if (!question || chatLoading.value) return;

          addMessage('user', question);
          chatInput.value = '';
          scrollToBottom();

          chatLoading.value = true;
          try {
            const res = await api.post('/ai/recruit/chat', { question });
            let reply = '';
            if (res.data && res.data.code === 200) {
              reply = res.data.data || res.data.msg || '暂无回复';
            } else {
              reply = res.data?.msg || '请求失败，请稍后重试';
            }
            addMessage('assistant', reply);
          } catch { /* 拦截器已处理 */ } finally {
            chatLoading.value = false;
            scrollToBottom();
          }
        }

        // ──────────────────── 标签切换 ────────────────────
        let candidateFetched = false;
        let recommendFetched = false;
        function handleTabClick(tab) {
          const label = tab.props.label;
          if (label === '候选人管理' && !candidateFetched) {
            candidateFetched = true;
            fetchCandidateList();
          }
          if (label === '候选人推荐' && !recommendFetched) {
            recommendFetched = true;
            fetchRecommendList();
            fetchRecommendOptions();
          }
        }

        // ──────────────────── 初始化 ────────────────────
        onMounted(() => {
          fetchList();
        });

        return {
          // 岗位管理
          positions, total, currentPage, pageSize, loading, searchForm,
          addDialogVisible, addFormRef, addForm, addRules, addLoading,
          editingRowId, editForm, editLoading,
          statusOptions,
          getStatusInfo, formatDate,
          openAddDialog, resetAddForm, handleAdd,
          handleEdit, handleSave, handleCancel, handlePositionDelete,
          handleSearch, handleReset,
          handlePageChange, handleSizeChange,

          // 候选人管理
          candidates, candidateTotal, candidatePage, candidatePageSize, candidateLoading,
          candidateAddDialogVisible, candidateAddFormRef, candidateAddForm, candidateAddRules, candidateAddLoading,
          candidateEditingRowId, candidateEditForm, candidateEditLoading,
          educationOptions,
          openCandidateAddDialog, resetCandidateAddForm, handleCandidateAdd,
          handleCandidateEdit, handleCandidateSave, handleCandidateCancel, handleCandidateDelete,
          handleCandidatePageChange, handleCandidateSizeChange,

          // 候选人推荐
          recommends, recommendTotal, recommendPage, recommendPageSize, recommendLoading,
          recommendAddDialogVisible, recommendAddFormRef, recommendAddForm, recommendAddRules, recommendAddLoading,
          recommendEditingRowId, recommendEditForm, recommendEditLoading,
          recommendStatusOptions, positionOptions, positionOptionsLoading, candidateOptions, candidateOptionsLoading,
          getRecommendTagInfo, resetRecommendAddForm, openRecommendAddDialog, handleRecommendAdd,
          handleRecommendEdit, handleRecommendSave, handleRecommendCancel,
          handleRecommendPageChange, handleRecommendSizeChange,

          // AI 智能对话
          messages, chatInput, chatLoading, chatMessagesRef,
          handleSend, fillQuickPrompt,

          // 通用
          handleTabClick
        };
      }
    });

    // ── 注册 Element Plus 图标 ──
    for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, comp);
    }
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
